<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Parcial - Atención Universitaria</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>UniConnect</h1>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <main>
        <section id="inicio">
            <h2>Estamos aquí para ayudarte</h2>
            <p>Envianos tus consultas, sugerencias o comentarios mediante nuestro formulario de contacto.</p>
        </section>

        <section id="contacto">
            <h2>Contáctanos</h2>
            <form id="formulario-contacto">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="from_name" placeholder="Ingresa tu nombre" required>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="from_email" placeholder="ejemplo@correo.com" required>
                <label for="asunto">Asunto</label>
                <select id="asunto" name="subject" required>
                    <option value="">Selecciona un asunto</option>
                    <option value="Consulta">Consulta</option>
                    <option value="Sugerencia">Sugerencia</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="message" placeholder="Escribe tu mensaje..." rows="5" required></textarea>

                <button type="submit">Enviar Mensaje</button>
                <p id="estado" role="status" aria-live="polite"></p>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 UniConnect - Portal de atención universitaria</p>
    </footer>
</body>

</html>
